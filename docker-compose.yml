# ============================================================
# 家庭物品系统 · 全栈一键部署
#
#   docker compose up -d --build
#
# 四个容器一套内网：
#   web(nginx:80) ──反代──> server(go:8080) ──> mysql:3306 / redis:6379
#
# 设计要点：
#   - MySQL / Redis 故意不映射宿主端口：只在 compose 内网可达。
#     一是服务器上已有实例占着 3306/6379（避免冲突），
#     二是数据库不对公网暴露，少一个攻击面。
#   - 唯一入口是 web 一个端口（WEB_PORT，默认 8088）。
#   - 数据全在 named volume：重建容器/镜像不丢数据。
# ============================================================
name: home-items

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      # bind mount 到项目目录：数据跟着项目走，备份 /www/home-items 即备份全部。
      # MySQL 镜像 entrypoint 以 root 起手会自动 chown，无需预置属主
      - ./data/mysql:/var/lib/mysql
      # 仅在数据目录为空（首次初始化）时自动执行；已有数据则静默跳过。
      # 改了 init.sql 想重跑：清空 ./data/mysql 再 up（会清库！）
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ 是 compose 转义：让 $MYSQL_ROOT_PASSWORD 在容器内展开（它有这个环境变量），
      # 而不是被 compose 在部署机上替换
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s   # 8.4 首次初始化要重建系统表，给足时间

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      TZ: Asia/Shanghai
    # appendonly：持久化刷新令牌/限流计数（进程重启不把所有人踢下线）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 容器间用服务名互访（mysql/redis 是 Docker 内置 DNS 名）；
      # .env 里的密码由 compose 在部署机上替换进 DSN
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/home_items?charset=utf8mb4&parseTime=true&loc=Local&multiStatements=true
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（>=32 字节）}
      PORT: "8080"
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: "5"
      UPLOAD_GRACE: 24h
      # 前面挂 HTTPS（TLS 终止在 Nginx）后改 true，浏览器才允许 Set-Cookie 带 Secure
      COOKIE_SECURE: "false"
    volumes:
      # 注意：bind mount 不继承镜像内目录属主（named volume 才有"首次复制"行为）。
      # server 容器以非 root 的 app(10001) 运行，宿主机必须预置：
      #   mkdir -p data/uploads && chown 10001:10001 data/uploads
      # 否则上传图片全部 permission denied
      - ./data/uploads:/app/uploads
    depends_on:
      # 等 MySQL 真正能响应再起 Go 服务，避免启动时连接被拒直接 panic 退出
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"   # 服务器 80/8080 被占就改 .env 里的 WEB_PORT
    depends_on:
      server:
        condition: service_healthy
