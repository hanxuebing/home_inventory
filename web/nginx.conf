# 生产前端配置：静态资源 + 同源反代（浏览器只看到本机一个 80 端口，CORS 整个消失）
# 开发期的 vite proxy（/api、/uploads → :8080）在这里是同构的镜像关系
server {
    listen 80;
    server_name _;

    # 与后端 MAX_UPLOAD_MB=5 对齐（留一点 multipart 边界开销）
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vue SPA history 路由：刷新 /items/3 时服务器上并没有这个文件，
    # try_files 兜底回 index.html，交给前端路由接管（否则刷新即 404）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代。server 是 compose 服务名 —— Docker 内置 DNS 解析到容器 IP，
    # 容器重启换 IP 也不用手改配置。
    # proxy_pass 结尾不带 / ：URI 原样透传（/api/v1/items → server:8080/api/v1/items）
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 图片：后端本地磁盘静态服务（URL 是相对路径 /uploads/x.jpg，一并反代即可）
    location /uploads/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }
}
